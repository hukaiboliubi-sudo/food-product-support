  <style>
    :root {

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--canvas); font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 232px minmax(0, 1fr); }
    .sidebar { padding: 24px 18px; color: #eff7f2; background: linear-gradient(180deg, #123d2e, #0d2c22); display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 11px; margin: 2px 8px 28px; }
    .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 13px; color: #173f30; background: #f1bd62; font-weight: 800; font-size: 21px; }
    .brand strong, .brand small { display: block; }.brand small { color: #9eb9ac; font-size: 11px; margin-top: 3px; }
    .nav-title { padding: 0 10px; color: #789b8b; font-size: 10px; letter-spacing: 2px; }
    .nav { display: grid; gap: 7px; margin-top: 10px; }
    .nav button { border: 0; border-radius: 10px; padding: 12px; color: #abc4b8; background: transparent; text-align: left; }
    .nav button.active { color: white; background: rgba(255,255,255,.1); }.nav button span { float: right; }
    .support-card { margin-top: auto; padding: 15px; border: 1px solid rgba(255,255,255,.1); border-radius: 14px; background: rgba(255,255,255,.06); }

    main { padding: 28px 30px 36px; min-width: 0; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 19px; }
    .eyebrow { margin: 0 0 5px; color: #76857d; font-weight: 700; font-size: 10px; letter-spacing: 2px; }
    h1 { margin: 0; font-size: 27px; letter-spacing: -.5px; }.agent { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
    .avatar { width: 35px; height: 35px; border-radius: 50%; display: grid; place-items: center; color: white; background: var(--green); font-weight: 700; }
    .search-card { padding: 16px; border: 1px solid var(--line); border-radius: 15px; background: var(--paper); box-shadow: var(--shadow); }
    .search-row { display: grid; grid-template-columns: minmax(240px, 1fr) 145px 145px 145px; gap: 9px; }
    .search-wrap { position: relative; }.search-wrap span { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: #829087; }
    input, select { width: 100%; border: 1px solid #dce4df; border-radius: 10px; padding: 11px 12px; color: #33443b; background: #fbfcfb; outline: none; }
    input { padding-left: 39px; } input:focus, select:focus { border-color: #6fa68e; box-shadow: 0 0 0 3px #e8f3ed; }
    .hint { margin: 10px 2px 0; color: #839087; font-size: 10px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 17px 0; }
    .stat { padding: 15px 16px; border: 1px solid var(--line); border-radius: 13px; background: white; }
    .stat span, .stat small { display: block; color: var(--muted); font-size: 10px; }.stat strong { display: block; margin: 5px 0; font-size: 25px; }.stat small { color: #94a098; }
    .workspace { display: grid; grid-template-columns: minmax(420px, .9fr) minmax(460px, 1.1fr); gap: 15px; align-items: start; }
    .panel { border: 1px solid var(--line); border-radius: 15px; background: white; overflow: hidden; box-shadow: var(--shadow); }
    .panel-head { padding: 15px 17px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
    .panel-head h2 { margin: 0; font-size: 15px; }.panel-head span { color: var(--muted); font-size: 10px; }
    .product-list { max-height: calc(100vh - 327px); min-height: 430px; overflow-y: auto; }
    .product-card { width: 100%; display: grid; grid-template-columns: 72px 1fr auto; gap: 13px; padding: 13px 15px; border: 0; border-bottom: 1px solid #edf0ee; background: white; text-align: left; }
    .product-card:hover, .product-card.selected { background: #f4f8f5; }.product-card.selected { box-shadow: inset 3px 0 var(--green); }
    .food-image { width: 72px; height: 72px; border-radius: 12px; display: grid; place-items: center; color: white; font-size: 31px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
    .product-card h3 { margin: 3px 0 5px; font-size: 13px; }.product-card p { margin: 0 0 8px; color: #87938c; font-size: 10px; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; }.tag { padding: 3px 7px; border-radius: 999px; color: #557166; background: #edf4f0; font-size: 9px; }

    .btn.primary { color: white; background: var(--green); }.btn.secondary { color: #4d5e55; border: 1px solid #dce4df; background: white; }
    .section { padding: 18px 20px; border-bottom: 1px solid var(--line); }.section:last-child { border-bottom: 0; }.section h3 { margin: 0 0 12px; font-size: 13px; }

rand":"未标注品牌","caseQty":"","outerL":"","outerW":"","outerH":"","productL":"","productW":"","productH":"","labelImageId":"","link":""}];
    let selectedId = products[0]?.id || "";
    let recent = [];
    const el = id => document.getElementById(id);
    const clean = value => value || "未提供";
    const size = (a,b,c) => a && b && c ? `${a} × ${b} × ${c} cm` : "未提供";
    const colorOf = brand => ({新雅:"linear-gradient(135deg,#c86245,#7d302b)",丰收日:"linear-gradient(135deg,#d39b43,#835728)",乔家栅:"linear-gradient(135deg,#5b997b,#275b47)",鲜得来:"linear-gradient(135deg,#668db1,#36536f)"}[brand] || "linear-gradient(135deg,#899b91,#506158)");
    const iconOf = category => category.includes("点心") ? "🥟" : category.includes("月饼") ? "🥮" : category.includes("礼") ? "🎁" : category.includes("腊") ? "🥩" : category.includes("耗材") || category.includes("袋") ? "📦" : "🍽";
    const category = el("category"), brand = el("brand");
    [...new Set(products.map(p => p.category))].sort().forEach(v => category.insertAdjacentHTML("beforeend", `<option value="${v}">${v}</option>`));
    [...new Set(products.map(p => p.brand))].sort().forEach(v => brand.insertAdjacentHTML("beforeend", `<option value="${v}">${v}</option>`));
    ["search","category","brand","linkStatus"].forEach(id => el(id).addEventListener(id === "search" ? "input" : "change", render));
    el("search").addEventListener("keydown", e => { if (e.key === "Enter") { const p = filtered()[0]; if (p) selectProduct(p.id); } });
    function filtered() {
      const q = el("search").value.trim().toLowerCase(), linkStatus = el("linkStatus").value;
      return products.filter(p => (!q || [p.id,p.name,p.spec,p.category,p.barcode,p.brand].join(" ").toLowerCase().includes(q))
        && (!category.value || p.category === category.value) && (!brand.value || p.brand === brand.value)
        && (!linkStatus || (linkStatus === "有链接" ? !!p.link : !p.link)));
    }
    function render() {
      const list = filtered();
      el("resultCount").textContent = `找到 ${list.length} 款产品`;
      el("productList").innerHTML = list.length ? list.map(p => `<button class="product-card ${p.id === selectedId ? "selected" : ""}" onclick="selectProduct('${p.id}')">
        <div class="food-image" style="background:${colorOf(p.brand)}">${iconOf(p.category)}</div><div><h3>${p.name || "未命名产品"}</h3><p>${clean(p.id)} · ${clean(p.spec)} · ${p.brand}</p><div class="tags"><span class="tag">${p.category}</span><span class="tag">${p.barcode ? "条码已录入" : "无条码"}</span><span class="tag ${p.link ? "" : "orange"}">${p.link ? "有商品链接" : "无商品链接"}</span></div></div><span class="price">${p.caseQty ? `${p.caseQty}件/箱` : "—"}</span></button>`).join("") : `<div class="empty"><b>没有找到匹配产品</b>请尝试更换关键词或筛选条件</div>`;
      const brands = new Set(products.map(p=>p.brand)).size, categories = new Set(products.map(p=>p.category)).size, links = products.filter(p=>p.link).length;
      el("stats").innerHTML = [["产品总数",products.length,"来自产品数据-冷冻"],["品牌数量",brands,"已录入品牌"],["产品分类",categories,"包含未分类产品"],["商品链接",links,"可直接打开"]].map(x=>`<article class="stat"><span>${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small></article>`).join("");
      renderDetail();
    }
    function selectProduct(id) { selectedId = id; recent = [id, ...recent.filter(x=>x!==id)].slice(0,5); render(); renderRecent(); if (innerWidth < 700) el("detail").scrollIntoView({behavior:"smooth"}); }
    function renderDetail() {
      const p = products.find(x=>x.id===selectedId) || filtered()[0];
      if (!p) { el("detail").innerHTML = `<div class="empty"><b>请选择一款产品</b>产品详细资料会显示在这里</div>`; return; }
      const specReply = `您好，${p.name}的规格为${clean(p.spec)}${p.caseQty ? `，箱规为每箱${p.caseQty}件` : ""}。`;
      const barcodeReply = `您好，${p.name}的货号为${clean(p.id)}，条形码为${clean(p.barcode)}。`;
      const sizeReply = `您好，${p.name}的产品尺寸为${size(p.productL,p.productW,p.productH)}，外箱尺寸为${size(p.outerL,p.outerW,p.outerH)}。`;
      el("detail").innerHTML = `<div class="detail-hero"><div class="food-image" style="background:${colorOf(p.brand)}">${iconOf(p.category)}</div><div><p class="eyebrow">${p.brand} · ${p.category}</p><h2>${p.name || "未命名产品"}</h2><div class="sub">货号 ${clean(p.id)} · 条形码 ${clean(p.barcode)}</div><div class="hero-price">${clean(p.spec)} <small>${p.caseQty ? `/ ${p.caseQty}件/箱` : ""}</small></div><div class="actions"><button class="btn primary" onclick="copyText('${p.id}','货号')">复制货号</button><button class="btn secondary" onclick="copyInfo('${p.id}')">复制产品信息</button>${p.link ? `<button class="btn secondary" onclick="window.open('${p.link}','_blank')">打开商品链接</button>` : ""}</div></div></div>
      <div class="section"><h3>基础产品信息</h3><div class="info-grid">${[["货号",p.id],["品牌",p.brand],["分类",p.category],["条形码",p.barcode],["规格名称",p.spec],["单品重量",p.weight ? `${p.weight} kg` : ""],["箱规",p.caseQty ? `${p.caseQty} 件/箱` : ""],["商品链接",p.link ? "已录入，可点击打开" : "未提供"]].map(x=>`<div class="info"><span>${x[0]}</span><strong>${clean(x[1])}</strong></div>`).join("")}</div></div>
      <div class="section"><h3>包装尺寸</h3><div class="policy"><article><strong>产品尺寸</strong><p>${size(p.productL,p.productW,p.productH)}</p></article><article><strong>外箱尺寸</strong><p>${size(p.outerL,p.outerW,p.outerH)}</p></article></div></div>
      <div class="section"><h3>客服查询参考</h3><details open><summary>客户询问规格和箱规</summary><p>${specReply}</p></details><details><summary>客户询问货号或条形码</summary><p>${barcodeReply}</p></details><details><summary>客户询问包装尺寸</summary><p>${sizeReply}</p></details></div>
      <div class="section"><h3>推荐客服话术</h3>${[[`规格回复`,specReply],[`货号与条码回复`,barcodeReply],[`尺寸回复`,sizeReply]].map((x,i)=>`<div class="script"><div><strong>${x[0]}</strong><button onclick="copyGenerated('${p.id}',${i})">复制话术</button></div><p>${x[1]}</p></div>`).join("")}</div>`;
    }
    function renderRecent() { el("recentList").innerHTML = recent.map(id => { const p=products.find(x=>x.id===id); return `<button onclick="selectProduct('${id}')"><strong>${iconOf(p.category)} ${p.name}</strong><br>${p.id}</button>`; }).join(""); }
    function generatedScripts(p) { return [`您好，${p.name}的规格为${clean(p.spec)}${p.caseQty ? `，箱规为每箱${p.caseQty}件` : ""}。`,`您好，${p.name}的货号为${clean(p.id)}，条形码为${clean(p.barcode)}。`,`您好，${p.name}的产品尺寸为${size(p.productL,p.productW,p.productH)}，外箱尺寸为${size(p.outerL,p.outerW,p.outerH)}。`]; }
    function copyGenerated(id,index) { copyText(generatedScripts(products.find(x=>x.id===id))[index],"客服话术"); }
    function copyInfo(id) { const p=products.find(x=>x.id===id); copyText(`产品：${p.name}
货号：${clean(p.id)}
品牌：${p.brand}
分类：${p.category}
规格：${clean(p.spec)}
条形码：${clean(p.barcode)}
单品重量：${p.weight ? `${p.weight} kg` : "未提供"}
箱规：${p.caseQty ? `${p.caseQty} 件/箱` : "未提供"}
产品尺寸：${size(p.productL,p.productW,p.productH)}
外箱尺寸：${size(p.outerL,p.outerW,p.outerH)}
商品链接：${clean(p.link)}`,"产品信息"); }
    function copyText(text,label) {
      const done=()=>showToast(`${label}已复制`);
      if (navigator.clipboard && location.protocol !== "file:") navigator.clipboard.writeText(text).then(done).catch(()=>legacyCopy(text,done)); else legacyCopy(text,done);
    }
    function legacyCopy(text,done) { const t=document.createElement("textarea"); t.value=text; t.style.position="fixed"; t.style.opacity="0"; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); done(); }
    let toastTimer; function showToast(msg) { const t=el("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1800); }
    render(); renderRecent();
</script>
